<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:," />
        <title>ZombiSurvive</title>
    </head>
    <body>
        <main class="game-shell">
            <header>
                <p class="eyebrow">Выживание начинается здесь</p>
                <h1>ZombiSurvive</h1>
                <p class="description">
                    WASD — движение · Левый клик — идти к точке · Мышь — прицел. WASD отменяет
                    выбранную точку.
                </p>
            </header>
            <p id="connection-status" role="status">Подключение к локальному миру…</p>
            <button id="reconnect" type="button" disabled>Подключиться снова</button>
            <section id="game" aria-label="Игровое поле"></section>
            <p class="caption">
                Клетка: 1 метр · Серые блоки непроходимы. Обходите их WASD или промежуточными
                кликами.
            </p>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
